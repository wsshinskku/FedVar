[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedvar"
version = "0.2.0"
description = "Official author implementation of FedVar"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Wooseok Shin"}, {name = "Jitae Shin"}]
dependencies = ["numpy>=1.24", "torch>=2.2,<3"]

[project.optional-dependencies]
vision = ["torchvision>=0.17"]
mobile = ["torchvision>=0.17", "timm>=1.0"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
fedvar = "fedvar.cli:main"

[project.urls]
Repository = "https://github.com/wsshinskku/FedVar"
Paper = "https://doi.org/10.1109/ITC-CSCC55581.2022.9894899"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
